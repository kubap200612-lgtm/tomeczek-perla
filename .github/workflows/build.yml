name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: rynek-analiza
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Wydaj jar w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release create "build-${{ github.run_number }}" "$JAR" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatyczny build z commita ${{ github.sha }}"
